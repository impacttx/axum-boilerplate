[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
sea-orm-migration = { version = "2.0.4", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.41"
