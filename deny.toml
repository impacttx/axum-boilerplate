# cargo-deny: dependency audit (advisories, licenses, sources) - the Rust analogue of bandit/pip-audit.
[advisories]
version = 2
# RUSTSEC-2023-0071 (rsa, via jsonwebtoken's rust_crypto backend for RS256): no patched release
# exists. Exploitation needs precise timing of private-key operations; only token issuance signs.
# Revisit by switching jsonwebtoken to the `aws_lc_rs` backend or when `rsa` ships a fix.
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2025-0141",
  "RUSTSEC-2024-0436",
  "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0", "BSL-1.0", "0BSD",
  "MPL-2.0", "NCSA",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# allow-git = ["https://github.com/zip-rs/zip2"]
